<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统名 · 交互演示</title>
<style>
  /* 骨架：把 :root 与文案换成项目自己的方向，别沿用这套中性配色 */
  :root {
    --bg: #f7f7f5; --surface: #fff; --surface2: #fafaf9; --line: #e7e5e4;
    --text: #1c1917; --text2: #57534e; --muted: #a8a29e;
    --accent: #2f6f5f; --ok: #059669; --warn: #b45309; --danger: #dc2626;
    --r: 10px; --pad: clamp(12px, 2vw, 20px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .num, .date { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  /* 1 顶部条 */
  .top {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px var(--pad); background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .top b { font-size: 15px; }
  .top .tagline { color: var(--text2); font-size: 12.5px; }
  .ro {
    margin-left: auto; padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
    color: var(--warn); background: #fffbeb; border: 1px solid #fde68a; white-space: nowrap;
  }

  /* 2 Hero：界面复刻 */
  .hero { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: clamp(300px, 58vh, 620px); }
  .side { padding: 10px 8px; background: var(--surface2); border-right: 1px solid var(--line); }
  .side button {
    display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 2px;
    border: 0; border-radius: 8px; background: none; color: var(--text2); font-size: 13px;
    transition: background .15s, color .15s;
  }
  .side button:hover { background: #0000000a; color: var(--text); }
  .side button[aria-current="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
  .main { display: flex; flex-direction: column; min-width: 0; padding: var(--pad); gap: 12px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--text2); font-size: 12.5px;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #2f6f5f14; }
  .grow { flex: 1 1 auto; }
  .primary { padding: 6px 14px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: #fff; font-size: 13px; }
  /* 表格：列名与状态文案取自真实系统 */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  th { font-size: 11.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  td { font-size: 13px; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface2); }
  .tag { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .t-wait { background: #fffbeb; color: var(--warn); }
  .t-ok { background: #ecfdf5; color: var(--ok); }
  .t-no { background: #fef2f2; color: var(--danger); }
  .row-act { padding: 3px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 12px; }
  .row-act:disabled { opacity: .45; cursor: not-allowed; }

  /* 辅助面板：分页签 + 操作日志 */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs button { padding: 6px 12px; border: 0; background: none; color: var(--text2); font-size: 12.5px; border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .panel { padding: 10px 12px; font-size: 12.5px; color: var(--text2); min-height: 78px; }
  .panel p { margin: 0 0 5px; }
  .panel .hit { color: var(--danger); }

  /* 3 功能分区 */
  .feats { display: grid; gap: 12px; padding: var(--pad); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .feat { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .feat h3 { margin: 0 0 6px; font-size: 14px; }
  .feat p { margin: 0 0 10px; color: var(--text2); font-size: 12.5px; }
  .feat .out { margin-top: 8px; font-size: 12px; color: var(--accent); min-height: 18px; }

  /* 4 技术栈与要点 + 5 页脚 */
  .stack { padding: var(--pad); border-top: 1px solid var(--line); }
  .stack ul { margin: 8px 0 0; padding-left: 18px; color: var(--text2); font-size: 12.5px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 11.5px; color: var(--text2); }
  footer { padding: 12px var(--pad) 20px; color: var(--muted); font-size: 11.5px; }

  /* 窄屏：侧栏折成顶部横向分页签 */
  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; }
    .side { display: flex; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .side button { width: auto; white-space: nowrap; }
    .side button[aria-current="true"] { box-shadow: inset 0 -2px 0 var(--accent); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f6f5f" stroke-width="2" aria-hidden="true">
    <rect x="3" y="3" width="18" height="18" rx="4" /><path d="M8 12h8M12 8v8" />
  </svg>
  <b>系统名</b>
  <span class="tagline">一句话定位：给谁解决什么问题</span>
  <span class="ro">演示数据 · 只读</span>
</header>

<section class="hero">
  <nav class="side" id="side" aria-label="模块导航"></nav>
  <div class="main">
    <div class="toolbar">
      <button type="button" class="chip" data-filter="全部" aria-pressed="true">全部</button>
      <button type="button" class="chip" data-filter="待审核" aria-pressed="false">待审核</button>
      <button type="button" class="chip" data-filter="已通过" aria-pressed="false">已通过</button>
      <span class="grow"></span>
      <button type="button" class="primary" id="batch">批量通过</button>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>编号</th><th>名称</th><th>所属</th><th>提交时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-tab="log">操作日志</button>
        <button type="button" role="tab" aria-selected="false" data-tab="rule">校验规则</button>
      </div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
</section>

<section class="feats">
  <div class="feat">
    <h3>功能点一</h3>
    <p>一句价值陈述：这块解决了什么问题，怎么解决的。</p>
    <button type="button" class="row-act" data-demo="1">试一下</button>
    <div class="out" id="out1"></div>
  </div>
  <div class="feat">
    <h3>功能点二</h3>
    <p>换成项目真实的能力，别留占位文案。</p>
    <button type="button" class="row-act" data-demo="2">试一下</button>
    <div class="out" id="out2"></div>
  </div>
</section>

<section class="stack">
  <div class="pills">
    <span class="pill">技术 A</span><span class="pill">技术 B</span><span class="pill">技术 C</span>
  </div>
  <ul>
    <li>要点一：写决策与取舍，不写「用了什么框架」</li>
    <li>要点二：与 showcase.config.ts 的 demo.points 保持同一口径</li>
  </ul>
</section>

<footer>个人作品演示，数据全部虚构；沙箱环境不做持久化，刷新即回初始状态。</footer>

<script>
  /* 状态机：所有动作只改 state 再 render()，不要在事件里直接改 DOM 文本 */
  var MODULES = ['模块一', '模块二', '模块三', '模块四', '模块五']
  var ROWS = [
    { id: 'R-1042', name: '示例条目甲', org: '技术部', at: '09-02 14:20', status: '待审核' },
    { id: 'R-1041', name: '示例条目乙', org: '市场部', at: '09-02 11:05', status: '待审核' },
    { id: 'R-1039', name: '示例条目丙', org: '技术部', at: '09-01 17:48', status: '已通过' },
    { id: 'R-1036', name: '示例条目丁', org: '运营部', at: '09-01 09:12', status: '已驳回' }
  ]
  var TAG = { '待审核': 't-wait', '已通过': 't-ok', '已驳回': 't-no' }
  var state = { module: MODULES[0], filter: '全部', tab: 'log', rows: ROWS.slice(), log: [] }

  function stamp() { return new Date().toLocaleTimeString('zh-CN', { hour12: false }) }
  function note(text, bad) { state.log.unshift({ at: stamp(), text: text, bad: !!bad }) }

  function render() {
    document.getElementById('side').innerHTML = MODULES.map(function (m) {
      return '<button type="button" aria-current="' + (m === state.module) + '">' + m + '</button>'
    }).join('')
    var rows = state.rows.filter(function (r) { return state.filter === '全部' || r.status === state.filter })
    document.getElementById('tbody').innerHTML = rows.map(function (r) {
      var done = r.status !== '待审核'
      return '<tr><td class="mono">' + r.id + '</td><td>' + r.name + '</td><td>' + r.org +
        '</td><td class="date">' + r.at + '</td><td><span class="tag ' + TAG[r.status] + '">' + r.status +
        '</span></td><td><button type="button" class="row-act" data-pass="' + r.id + '"' + (done ? ' disabled' : '') +
        '>通过</button> <button type="button" class="row-act" data-deny="' + r.id + '"' + (done ? ' disabled' : '') +
        '>驳回</button></td></tr>'
    }).join('') || '<tr><td colspan="6" style="color:var(--muted)">没有符合条件的记录</td></tr>'
    document.getElementById('panel').innerHTML = state.tab === 'rule'
      ? '<p>必填校验：名称、所属不可为空</p><p>状态机：待审核 → 已通过 / 已驳回，终态不可再流转</p><p>权限：仅审核角色可执行批量动作</p>'
      : (state.log.length ? state.log.map(function (l) {
          return '<p' + (l.bad ? ' class="hit"' : '') + '><span class="mono">' + l.at + '</span> ' + l.text + '</p>'
        }).join('') : '<p>点右上「批量通过」或行内动作，这里会记下每一步。</p>')
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c.dataset.filter === state.filter))
    })
    document.querySelectorAll('[role="tab"]').forEach(function (t) {
      t.setAttribute('aria-selected', String(t.dataset.tab === state.tab))
    })
  }

  function review(id, pass) {
    var row = state.rows.find(function (r) { return r.id === id })
    if (!row) return
    if (row.status !== '待审核') { note(id + ' 已是终态，状态机拒绝再次流转', true); return render() }
    row.status = pass ? '已通过' : '已驳回'
    note(id + ' ' + row.status + '，动作已写入审核日志')
    render()
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button')
    if (!t) return
    if (t.dataset.pass) return review(t.dataset.pass, true)
    if (t.dataset.deny) return review(t.dataset.deny, false)
    if (t.dataset.filter) { state.filter = t.dataset.filter; return render() }
    if (t.dataset.tab) { state.tab = t.dataset.tab; return render() }
    if (t.parentElement && t.parentElement.id === 'side') { state.module = t.textContent; note('切换到 ' + state.module); return render() }
    if (t.id === 'batch') {
      // 反例路径：权限不足被拒，演示「有约束的系统」
      note('当前演示账号无批量审核权限，操作被拒绝（RBAC 数据范围校验）', true)
      return render()
    }
    if (t.dataset.demo) {
      document.getElementById('out' + t.dataset.demo).textContent = '演示输出：换成该功能点真实的可见结果'
    }
  })

  render()
</script>
</body>
</html>
