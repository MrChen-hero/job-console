<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>校园二手交易 · 审核状态机交互演示（示例）</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fafaf9; color: #1c1917; margin: 0; padding: 24px; }
  h1 { font-size: 18px; }
  .post { background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 16px; max-width: 480px; }
  .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .s-pending { background: #fffbeb; color: #b45309; }
  .s-approved { background: #ecfdf5; color: #059669; }
  .s-rejected { background: #fef2f2; color: #dc2626; }
  button { margin: 12px 8px 0 0; padding: 8px 14px; border-radius: 8px; border: 1px solid #d6d3d1; background: #fff; cursor: pointer; }
  .log { margin-top: 16px; font-size: 12px; color: #57534e; }
</style>
</head>
<body>
<h1>审核状态机 · 交互演示</h1>
<div class="post">
  <p>帖子：二手转让一台 95 新机械键盘…</p>
  <p>状态：<span id="status" class="status s-pending">待审核</span></p>
  <button onclick="review(true)">通过</button>
  <button onclick="review(false)">拒绝</button>
  <div id="log" class="log"></div>
</div>
<script>
  var state = 'pending'
  var log = document.getElementById('log')
  function review(pass) {
    if (state !== 'pending') { log.textContent = '已终审，不能再操作（状态机约束）'; return }
    state = pass ? 'approved' : 'rejected'
    var el = document.getElementById('status')
    el.textContent = pass ? '已通过' : '已拒绝'
    el.className = 'status ' + (pass ? 's-approved' : 's-rejected')
    log.textContent = '审核动作已写入审核日志（时间：' + new Date().toLocaleTimeString() + '）'
  }
</script>
</body>
</html>
